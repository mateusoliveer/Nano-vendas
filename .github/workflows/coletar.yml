name: Coletar empresas e publicar
run-name: ${{ inputs.id || github.event_name }}

# Coleta do Google Maps com gosom/google-maps-scraper (MIT), normaliza em data/empresas.json
# e publica o site no GitHub Pages. Roda toda segunda, sob demanda e a cada push (só publica).
on:
  push:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      consultas:
        description: 'Buscas desta coleta, separadas por ; (vazio = usar pipeline/consultas.txt)'
        required: false
        default: ''
      profundidade:
        description: 'Quantas rolagens por busca (1 = rápido, ~20 empresas; 5 = ~100)'
        required: false
        default: '3'
      id:
        description: 'Rótulo da execução (usado pela busca ao vivo)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  coletar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Preparar buscas
        env:
          EXTRA: ${{ inputs.consultas }}
        run: |
          mkdir -p out && chmod 777 out
          if [ -n "$EXTRA" ]; then
            printf '%s\n' "$EXTRA" | tr ';' '\n'
          else
            cat pipeline/consultas.txt
          fi | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^#' | grep -v '^$' | sed 's/.*/&#!#&/' > out/consultas.txt
          cat out/consultas.txt

      - name: Coletar no Google Maps
        env:
          PROF: ${{ inputs.profundidade || '3' }}
        run: |
          docker run --rm -v "$PWD/out:/out" gosom/google-maps-scraper:latest \
            -input /out/consultas.txt -results /out/resultados.json -json \
            -lang pt-BR -depth "$PROF" -c 4 -exit-on-inactivity 1m
          ls -la out

      - name: Juntar com a base e salvar (tenta de novo se outra coleta salvou antes)
        env:
          EXTRA: ${{ inputs.consultas }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "nano-vendas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            python3 pipeline/normalizar.py out/resultados.json data/empresas.json
            if [ -n "$EXTRA" ]; then
              printf '%s\n' "$EXTRA" | tr ';' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | while read -r q; do
                grep -qixF "$q" pipeline/consultas.txt || echo "$q" >> pipeline/consultas.txt
              done
            fi
            git add data pipeline/consultas.txt
            git diff --cached --quiet && exit 0
            git commit -q -m "Base de empresas atualizada ($(date +%F))"
            git push -q origin "HEAD:$BRANCH" && exit 0
            sleep $((RANDOM % 6 + 2))
          done
          exit 1

  publicar:
    needs: coletar
    if: always() && (needs.coletar.result == 'success' || needs.coletar.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Montar site
        run: mkdir _site && cp -r index.html styles.css app.js assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
